<!doctype html>
<html lang="pt-BR" data-tema="escuro">
  <head>
    <meta charset="utf-8" />
    <!-- O renderer roda em file:// dentro do Electron e não fala com a rede:
         nada de fonte de CDN, script remoto ou imagem externa (F1-16 §Tipografia). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapas Fácil</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
