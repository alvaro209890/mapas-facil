[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapasfacil-nucleo"
version = "0.4.0"
description = "Sidecar Python do Mapas Fácil — geo, MapSpec, motores, quantitativos e fsguard"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Mapas Fácil" }]
dependencies = [
  "jsonschema>=4.21,<5",
  "ulid-py>=1.1,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "pyshp>=2.3,<3",
  "pymupdf>=1.24,<2",
  "matplotlib>=3.8,<4",
  "openpyxl>=3.1,<4",
  "pillow>=10.0,<12",
  "argon2-cffi>=23.1,<26",
  "keyring>=25.0,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
]
empacotar = [
  "pyinstaller>=6.0,<7",
]

[project.scripts]
mapasfacil-nucleo = "mapasfacil_nucleo.__main__:main_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["mapasfacil_nucleo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["mapasfacil_nucleo"]
omit = ["mapasfacil_nucleo/motores/*"]

[tool.coverage.report]
fail_under = 100
include = ["mapasfacil_nucleo/fsguard.py"]
