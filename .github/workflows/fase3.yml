name: CI — Fase 3 (servidor, web, e2e, desktop e guardas)

# Anéis 1 e 2 (W-13). Nenhum job usa segredo real: 9Router, SEMA e Planet ficam
# em fake/cassete. O job `desktop` existe para provar que a Fase 3 não quebrou o
# app Windows — ele nunca é desligado "para passar".

on:
  push:
    branches: [main]
    paths:
      - "Fase_3_Web/**"
      - "Fase_1_Desktop/**"
      - "shared/**"
      - ".github/workflows/fase3.yml"
  pull_request:
    paths:
      - "Fase_3_Web/**"
      - "Fase_1_Desktop/**"
      - "shared/**"
      - ".github/workflows/fase3.yml"

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  servidor:
    name: servidor (pytest, anéis 1–2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            Fase_3_Web/servidor/pyproject.toml
            Fase_1_Desktop/nucleo/pyproject.toml

      - name: Dependências de sistema (GDAL + fontes)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin fonts-liberation

      - name: Instalar núcleo e servidor
        run: |
          python -m pip install --upgrade pip
          pip install -e Fase_1_Desktop/nucleo
          pip install -e "Fase_3_Web/servidor[dev]"

      - name: pytest do servidor
        working-directory: Fase_3_Web/servidor
        run: pytest -q

  web:
    name: web (typecheck, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: Fase_3_Web/web/pnpm-lock.yaml

      - name: Instalar
        working-directory: Fase_3_Web/web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: Fase_3_Web/web
        run: pnpm typecheck

      - name: Testes unitários
        working-directory: Fase_3_Web/web
        run: pnpm test

      - name: Build
        working-directory: Fase_3_Web/web
        run: pnpm build

  e2e:
    name: e2e (Playwright contra fake_nucleo)
    runs-on: ubuntu-latest
    needs: [servidor, web]
    steps:
      - uses: actions/checkout@v7

      - name: Sem spec ainda
        run: |
          if [ ! -d Fase_3_Web/web/e2e ]; then
            echo "Sem suíte e2e neste marco (nasce no W6) — nada a rodar."
            exit 0
          fi
          echo "Suíte e2e presente: configure o job no marco W6 (servidor com fake_nucleo)."

  desktop:
    name: desktop (não quebrou)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: Fase_1_Desktop/app/pnpm-lock.yaml

      - name: Instalar
        working-directory: Fase_1_Desktop/app
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: Fase_1_Desktop/app
        run: pnpm typecheck

      - name: Testes
        working-directory: Fase_1_Desktop/app
        run: pnpm test

  guardas:
    name: guardas (anti-padrões e segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bind aberto no servidor/deploy (AW-06)
        run: |
          set -e
          if grep -rn --exclude-dir=.venv --exclude-dir=__pycache__ --exclude-dir=node_modules \
               --include='*.py' --include='*.sh' --include='*.yml' --include='*.yaml' --include='*.toml' \
               "0\.0\.0\.0" Fase_3_Web/servidor Fase_3_Web/deploy \
               | grep -v 'test_esqueleto.py'; then
            echo "::error::bind no IP curinga encontrado (use 127.0.0.1)"
            exit 1
          fi
          echo "ok"

      - name: Regra geo no backend (AW-01/D23)
        run: |
          set -e
          PADRAO='import[[:space:]]+mapasfacil_nucleo\.(motores|camadas|agente|quantitativos)|from[[:space:]]+mapasfacil_nucleo\.(motores|camadas|agente|quantitativos)'
          if grep -rnE "$PADRAO" Fase_3_Web/servidor/mapasfacil_servidor; then
            echo "::error::o servidor importou regra do núcleo (só contas.senha e utilitários puros)"
            exit 1
          fi
          echo "ok"

      - name: Navegador não chama o núcleo (AW-02) nem anima por timer (AW-03)
        run: |
          set -e
          if [ -d Fase_3_Web/web/src ]; then
            if grep -rn "chamar(" Fase_3_Web/web/src --include='*.ts' --include='*.tsx'; then
              echo "::error::o cliente web não fala com o núcleo direto (só /api/v1)"
              exit 1
            fi
            if [ -d Fase_3_Web/web/src/palco ] && \
               grep -rn "setTimeout" Fase_3_Web/web/src/palco --include='*.ts' --include='*.tsx' \
               | grep -v 'executor'; then
              echo "::error::animação só por evento real do núcleo (AP-07)"
              exit 1
            fi
          fi
          echo "ok"

      - name: Segredo em texto no código da Fase 3
        run: |
          set -e
          # `tests/` do núcleo ficam de fora: eles contêm chaves FALSAS de propósito
          # (casos do redator de log). Aqui vale o código que vai para o servidor.
          PADRAO='(^|[^[:alnum:]_])(api_key|authkey)=[A-Za-z0-9_-]{12,}|PLAK[0-9a-f]{16,}'
          if grep -rnE "$PADRAO" Fase_3_Web Fase_1_Desktop/nucleo/mapasfacil_nucleo \
               --exclude-dir=.venv --exclude-dir=__pycache__ --exclude-dir=node_modules --exclude-dir=dist \
               --include='*.py' --include='*.ts' --include='*.tsx' --include='*.json' --include='*.yml' --include='*.sh'; then
            echo "::error::possível segredo em texto (AP-03)"
            exit 1
          fi
          echo "ok"

      - name: .mxd versionado sem chave
        run: |
          set -e
          if [ -f ferramentas/chaves_mxd.py ]; then
            python3 ferramentas/chaves_mxd.py verificar
          else
            echo "ferramentas/chaves_mxd.py ausente — nada a verificar"
          fi

  nucleo:
    name: núcleo (não quebrou)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Fase_1_Desktop/nucleo/pyproject.toml

      - name: Dependências de sistema
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin fonts-liberation

      - name: Instalar
        working-directory: Fase_1_Desktop/nucleo
        run: pip install -e ".[dev]"

      - name: pytest
        working-directory: Fase_1_Desktop/nucleo
        env:
          COVERAGE_RCFILE: ${{ github.workspace }}/Fase_1_Desktop/nucleo/pyproject.toml
        run: pytest -q
